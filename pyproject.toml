[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "job-agent"
version = "0.1.0"
description = "Job search automation: scraping, ATS scoring, lane matching, and resume generation."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "jinja2>=3.1.6",
  "pydantic>=2.12.5",
  "pypdf>=6.9.1",
  "scrapling[fetchers]>=0.4.2",
  "httpx>=0.27.0",
  "playwright>=1.40",
  "python-jobspy>=1.1.82",
]

[project.optional-dependencies]
dev = ["pytest>=9.0.2"]

[project.scripts]
job-agent = "job_agent.cli:main"
analyze-job = "job_agent.cli:analyze_job_main"
discover-jobs = "job_agent.cli:discover_jobs_main"
generate-resumes = "job_agent.cli:generate_resumes_main"
suggest-projects = "job_agent.cli:suggest_projects_main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-p no:cacheprovider -p no:tmpdir"
pythonpath = ["src"]
testpaths = ["tests"]
