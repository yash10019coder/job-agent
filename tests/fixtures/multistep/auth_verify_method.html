<!doctype html><html><head><title>Career Site</title></head><body><main>
<div id=pick><h1>Select your verification method</h1>
<div><label><input type=radio name=m value=sms> <b>Text Message</b> +91 91234 56780</label></div>
<div><label><input type=radio name=m value=email> <b>Email Message</b> candidate@example.com</label></div>
<button id=send disabled>Send passcode</button> <a href="#">Back</a></div>
<div id=code style="display:none"><h1>Enter your passcode</h1><div id=err></div>
<label for=c>Security code</label><input id=c><button id=nx>Verify</button></div></main>
<script>
let chosen = '';
document.querySelectorAll('input[name=m]').forEach((r) => r.onclick = () => { chosen = r.value; document.getElementById('send').disabled = false; });
document.getElementById('send').onclick = () => {
  if (chosen !== 'email') { document.getElementById('pick').innerHTML = '<h1>We sent a text message</h1><p>Check your phone.</p>'; return; }   // a text cannot be read by the agent
  document.getElementById('pick').style.display = 'none'; document.getElementById('code').style.display = 'block';
};
document.getElementById('nx').onclick = () => { if (document.getElementById('c').value === '482913') { location.href = 'step1.html'; } else { document.getElementById('err').innerHTML = '<div role=alert>Invalid code</div>'; } };
</script></body></html>
