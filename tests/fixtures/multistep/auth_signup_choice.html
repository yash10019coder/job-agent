<!doctype html><html><head><title>Join</title></head><body><main><h1>Find your next role</h1><div id=err></div>
<button id=g>Continue with Google</button>
<label for=fn>First name</label><input id=fn><label for=ln>Last name</label><input id=ln>
<label for=em>Email</label><input id=em type=email><label for=pw>Password</label><input id=pw type=password>
<input type=checkbox id=ag><label for=ag>I agree to the Terms of Service and Privacy Policy</label>
<button id=nx>Create account</button><button id=si>Sign in</button></main><script>
document.getElementById('nx').onclick=()=>{const errs=[];
 if(!document.getElementById('em').value||!document.getElementById('fn').value) errs.push('Name and email are required.');
 if(document.getElementById('pw').value.length<12) errs.push('Password must be at least 12 characters.');
 if(!document.getElementById('ag').checked) errs.push('Please accept the terms.');
 if(errs.length){document.getElementById('err').innerHTML='<div role=alert>'+errs.join(' ')+'</div>';return;} location.href='auth_code.html'; };
</script></body></html>
